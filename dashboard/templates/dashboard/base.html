{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{% block title %}Gamio — Teacher Dashboard{% endblock %}</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'dashboard/css/style.css' %}">
</head>
<body class="{% block body_class %}{% endblock %}">
<div id="app" class="{% block app_class %}{% endblock %}">
  <div class="shell {% block shell_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </div>
</div>

{% if messages %}
  {% for message in messages %}
    <div class="toast {% if message.tags %}{{ message.tags }}{% endif %}" data-toast>{{ message }}</div>
  {% endfor %}
{% endif %}

<script>
  // Close any open nav dropdown when clicking outside it.
  document.addEventListener('click', function(e){
    document.querySelectorAll('.dropdown.open').forEach(function(dd){
      if(!dd.contains(e.target) && !e.target.closest('.icon-btn')){
        dd.classList.remove('open');
      }
    });
  });
  function toggleMenu(e){
    e.stopPropagation();
    var dd = e.currentTarget.parentElement.querySelector('.dropdown');
    if(dd) dd.classList.toggle('open');
  }
  // Auto-dismiss toast messages, same timing as the original mock-up.
  document.querySelectorAll('[data-toast]').forEach(function(el){
    setTimeout(function(){ el.remove(); }, 2200);
  });
  // Toggle password field visibility (show / hide password)
  function togglePasswordVisibility(inputId, btn) {
    var input = document.getElementById(inputId);
    if (!input) return;
    var isPassword = input.type === 'password';
    input.type = isPassword ? 'text' : 'password';
    var eyeIcon = btn.querySelector('.eye-icon');
    var eyeOffIcon = btn.querySelector('.eye-off-icon');
    if (eyeIcon && eyeOffIcon) {
      eyeIcon.style.display = isPassword ? 'none' : 'block';
      eyeOffIcon.style.display = isPassword ? 'block' : 'none';
    }
    var newLabel = isPassword ? 'Hide password' : 'Show password';
    btn.setAttribute('aria-label', newLabel);
    btn.setAttribute('title', newLabel);
    input.focus();
  }
</script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
